name: Schumann Hourly Collector

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: schumann-hourly-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify authorized Supabase target
        run: |
          bun -e '
            const raw = process.env.SUPABASE_URL || "";
            let url;
            try { url = new URL(raw.startsWith("http") ? raw : `https://${raw}.supabase.co`); }
            catch { throw new Error("Invalid Supabase target configuration"); }
            if (url.protocol !== "https:" || url.hostname !== "ayutlntfobofyxzjsywb.supabase.co" || url.username || url.password) {
              throw new Error("Supabase target is not the authorized Observatory project");
            }
            console.log("Authorized Observatory project confirmed");
          '
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Run collector
        run: bun run collect:schumann
        env:
          DATA_MODE: live
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
